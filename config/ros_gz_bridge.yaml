# 動態座標轉換 Gazebo --> ROS
- ros_topic_name: "/tf"
  gz_topic_name: "/x500/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS
  ros:
    frame_id: "base_link"

# 3D 光達數據 Gazebo --> ROS
- ros_topic_name: "/cloud_registered_body"
  gz_topic_name: "/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# 降落相機影像 Gazebo --> ROS
- ros_topic_name: "webcam/image_raw"
  gz_topic_name: "/landing_cam"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS
  # ros:
  #   frame_id: "camera_link"

# 降落相機規格資訊
- ros_topic_name: "webcam/camera_info"
  gz_topic_name: "landing_cam/info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS
  # ros:
  #   frame_id: "camera_link"

# 無人機正面拍攝相機畫面
- ros_topic_name: "/zed/zed_node/rgb/color/rect/image"
  gz_topic_name: "/zed2i"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

# 無人機正面拍攝相機資訊
- ros_topic_name: "/zed/zed_node/rgb/color/rect/camera_info"
  gz_topic_name: "zed2i/info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS
    
