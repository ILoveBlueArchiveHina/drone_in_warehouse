# 這個配置文件用於 ROS 2 與 Gazebo 之間的橋接
# 定義 ROS 傳給 Gazebo 或 Gazebo 傳給 ROS 使用什麼 Topic 名稱及類型
---
# 速度控制 ROS --> Gazebo
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/x500/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ

# 模擬時間 Gazebo --> ROS
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# # 里程計數據 Gazebo --> ROS
- ros_topic_name: "/Odometry"
  gz_topic_name: "/model/x500/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

# GPS數據 Gazebo --> ROS
# - ros_topic_name: "/gps/fix"
#   gz_topic_name: "/gps"
#   ros_type_name: "sensor_msgs/msg/NavSatFix"
#   gz_type_name: "ignition.msgs.NavSat"
#   direction: GZ_TO_ROS

# # IMU 數據 Gazebo --> ROS
# - ros_topic_name: "/imu/data"
