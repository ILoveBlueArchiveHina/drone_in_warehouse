amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:                # 控制器伺服器配置
  ros__parameters:
    use_sim_time: true            # 使用模擬時間，true用於模擬環境，false用於真實機器人
    ###############################################################################
    controller_frequency: 20.0    # 控制器執行頻率(Hz)，這個更改可能導致錯誤
    ###############################################################################
    costmap_update_timeout: 0.30  # 成本地圖更新超時時間(秒)，調大會增加容錯性但可能使用過期數據，調小會要求更及時的更新
    min_x_velocity_threshold: 0.001 # X軸最小速度閾值(米/秒)，調大會讓機器人更容易停止，調小會讓機器人保持更精確的運動
    min_y_velocity_threshold: 0.001 # Y軸最小速度閾值(米/秒)，調大會讓機器人側向移動更容易停止，調小會讓側向移動更精確
    min_theta_velocity_threshold: 0.3 # 角速度最小閾值(弧度/秒)，調大會讓機器人轉向更容易停止，調小會讓轉向更精確
    failure_tolerance: 0.5        # 失敗容忍度(秒)，調大會增加容錯性但可能掩蓋問題，調小會更快檢測到失敗
    progress_checker_plugins: ["progress_checker"] # 進度檢查器插件列表，用於檢查機器人是否在移動
    goal_checker_plugins: ["general_goal_checker"] # 目標檢查器插件列表，用於檢查是否到達目標，可選"precise_goal_checker"更精確
    controller_plugins: ["FollowPath"] # 控制器插件列表，使用路徑跟隨控制器
    current_goal_checker: "general_goal_checker"
    current_progress_checker: "progress_checker"
    use_realtime_priority: false  # 是否使用實時優先級，true會提高控制響應性但可能影響系統穩定性，false會更穩定但響應較慢

    progress_checker:              # 進度檢查器配置
      plugin: "nav2_controller::SimpleProgressChecker" # 進度檢查器插件類型
      required_movement_radius: 0.1 # 要求的最小移動半徑(米)，調大會讓機器人更容易被認為在移動，調小會要求更精確的移動
      movement_time_allowance: 10.0  # 移動時間容許值(秒)，調大會給機器人更多時間移動，調小會更快檢測到卡住

    general_goal_checker:         # 通用目標檢查器配置
      stateful: True              # 是否保持狀態，true會記住之前的檢查結果，false會每次都重新檢查
      plugin: "nav2_controller::SimpleGoalChecker" # 目標檢查器插件類型
      xy_goal_tolerance: 0.2     # XY平面目標容差(米)，調大會讓機器人更容易被認為到達目標，調小會要求更精確的定位
      yaw_goal_tolerance: 0.2    # 偏航角目標容差(弧度)，調大會讓機器人更容易被認為角度對齊，調小會要求更精確的角度對齊

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"  # 使用MPPI控制器插件
      time_steps: 56          # 預測軌跡的時間步數，調大會增加預測範圍但計算量增加，調小會減少預測範圍但響應更快
      model_dt: 0.05          # 模型時間步長(秒)，調大會讓軌跡更平滑但精度降低，調小會提高精度但計算量增加
      batch_size: 1000        # 採樣軌跡數量，調大會提高控制精度但計算量大幅增加，調小會降低精度但響應更快
      ax_max: 3.0             # X軸最大加速度，調大會讓機器人加速更快但可能不穩定，調小會更平穩但響應較慢
      ax_min: -3.0            # X軸最小加速度(減速度)，調大會讓機器人減速更快，調小會減速更平緩
      ay_max: 3.0             # Y軸最大加速度，調大會讓機器人側向移動更快，調小會限制側向移動
      az_max: 3.0             # Z軸最大加速度，調大會讓機器人垂直移動更快，調小會限制垂直移動
      vx_std: 0.2             # X軸速度標準差，調大會增加軌跡多樣性但可能不穩定，調小會讓軌跡更一致
      vy_std: 0.2             # Y軸速度標準差，調大會增加側向移動變化，調小會讓側向移動更穩定
      wz_std: 0.4             # 角速度標準差，調大會增加轉向變化，調小會讓轉向更平滑
      vx_max: 5.0             # X軸最大速度，調大會讓機器人移動更快但可能不安全，調小會更安全但效率降低
      vx_min: -5.0            # X軸最小速度(後退速度)，調大會讓後退更快，調小會限制後退速度
      vy_max: 3.0             # Y軸最大速度，調大會讓側向移動更快，調小會限制側向移動
      wz_max: 5.0             # 最大角速度，調大會讓轉向更快但可能不穩定，調小會轉向更平穩
      iteration_count: 1      # 優化迭代次數，調大會提高控制精度但計算量增加，調小會降低精度但響應更快
      prune_distance: 1.7     # 軌跡修剪距離，調大會保留更多軌跡點但計算量增加，調小會減少計算量但可能降低精度
      transform_tolerance: 0.5 # 座標轉換容差，調大會增加容錯性但精度降低，調小會提高精度但對延遲更敏感
      temperature: 0.3         # 採樣溫度參數，調大會增加軌跡隨機性，調小會讓軌跡更確定性
      gamma: 0.015            # 折扣因子，調大會更重視未來獎勵，調小會更重視即時獎勵
      motion_model: "Omni"    # 運動模型類型(Omni為全向，DiffDrive為差速，Ackermann為阿克曼)
      visualize: true         # 是否可視化軌跡，true會顯示預測軌跡，false會隱藏
      regenerate_noises: true # 是否重新生成噪聲，true會增加軌跡多樣性，false會保持一致性
      TrajectoryVisualizer:   # 軌跡可視化器參數
        trajectory_step: 5    # 軌跡顯示步長，調大會減少顯示的軌跡點，調小會顯示更多軌跡點
        time_step: 3          # 時間顯示步長，調大會減少時間標記，調小會顯示更密集的時間標記
      AckermannConstraints:   # 阿克曼轉向約束
        min_turning_r: 0.2    # 最小轉彎半徑，調大會讓轉彎更寬鬆，調小會限制轉彎能力
      critics: [               # 批評器列表，用於評估軌跡質量
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:       # 約束批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數，調大會讓約束違反懲罰更嚴重
        cost_weight: 4.0      # 成本權重，調大會更重視約束，調小會降低約束重要性
      GoalCritic:             # 目標批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 5.0      # 成本權重，調大會更重視到達目標，調小會降低目標重要性
        threshold_to_consider: 1.4 # 考慮閾值，調大會增加考慮範圍，調小會減少考慮範圍
      GoalAngleCritic:        # 目標角度批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 3.0      # 成本權重，調大會更重視角度對齊，調小會降低角度重要性
        threshold_to_consider: 0.5 # 考慮閾值，調大會增加角度容差，調小會減少角度容差
      PreferForwardCritic:    # 偏好前進批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 10.0     # 成本權重，調大會更偏好前進，調小會降低前進偏好
        threshold_to_consider: 0.5 # 考慮閾值，調大會增加前進偏好範圍，調小會減少前進偏好範圍
      CostCritic:             # 成本批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 1.0      # 成本權重，調大會更重視成本地圖，調小會降低成本地圖重要性
        near_collision_cost: 300    # 接近碰撞成本，調大會更積極避免障礙物，調小會降低避障積極性
        critical_cost: 300.0        # 臨界成本，調大會更重視危險區域，調小會降低危險區域重要性
        consider_footprint: false  # 是否考慮機器人足跡，false只考慮中心點，true會考慮整個形狀
        collision_cost: 1000000.0   # 碰撞成本，調大會更嚴格避免碰撞，調小會降低碰撞懲罰
        near_goal_distance: 1.0    # 接近目標距離，調大會提前開始減速，調小會更晚開始減速
        trajectory_point_step: 2   # 軌跡點步長，調大會減少檢查點，調小會增加檢查點
      PathAlignCritic:        # 路徑對齊批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 14.0     # 成本權重，調大會更重視路徑跟隨，調小會降低路徑跟隨重要性
        max_path_occupancy_ratio: 0.2 # 最大路徑佔用率，調大會允許更多偏離，調小會要求更嚴格跟隨(預設0.1)
        trajectory_point_step: 4   # 軌跡點步長，調大會減少檢查點，調小會增加檢查點
        threshold_to_consider: 0.5 # 考慮閾值，調大會增加對齊容差，調小會減少對齊容差
        offset_from_furthest: 20   # 最遠點偏移，調大會檢查更多路徑點，調小會減少檢查點
        use_path_orientations: false # 是否使用路徑方向，false只考慮位置，true會考慮方向
      PathFollowCritic:       # 路徑跟隨批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 5.0      # 成本權重，調大會更重視路徑跟隨，調小會降低路徑跟隨重要性
        offset_from_furthest: 5    # 最遠點偏移，調大會檢查更多路徑點，調小會減少檢查點
        threshold_to_consider: 1.4 # 考慮閾值，調大會增加跟隨容差，調小會減少跟隨容差
      PathAngleCritic:        # 路徑角度批評器
        enabled: true         # 是否啟用
        cost_power: 1         # 成本指數
        cost_weight: 2.0      # 成本權重，調大會更重視角度對齊，調小會降低角度重要性
        offset_from_furthest: 4    # 最遠點偏移，調大會檢查更多路徑點，調小會減少檢查點
        threshold_to_consider: 0.5 # 考慮閾值，調大會增加角度容差，調小會減少角度容差
        max_angle_to_furthest: 1.0 # 最大角度到最遠點，調大會允許更大角度變化，調小會限制角度變化
        mode: 0               # 模式，0為標準模式，其他值可能有不同行為
      # TwirlingCritic:       # 旋轉批評器(已註解)
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

global_costmap:               # 全域成本地圖配置
  global_costmap:
    ros__parameters:
      use_sim_time: true      # 使用模擬時間，true用於模擬，false用於真實機器人
      width: 300
      height: 300
      transform_tolerance: 0.5 # 座標轉換容差，調大會增加容錯性但精度降低，調小會提高精度但對延遲更敏感
      update_frequency: 1.0   # 更新頻率(Hz)，調大會提高地圖更新速度但消耗更多資源，調小會節省資源但更新較慢
      publish_frequency: 1.0  # 發布頻率(Hz)，調大會提高地圖發布速度，調小會減少網路負載
      max_obstacle_height: 2.0 # 最大障礙物高度(米)，調大會檢測更高障礙物但計算量增加，調小會節省計算量但可能忽略高障礙物
      global_frame: map       # 全域座標系，通常設為map
      robot_base_frame: base_link # 機器人底座座標系
      robot_radius: 0.1      # 機器人半徑(米)，調大會增加安全邊距但降低通過性，調小會提高通過性但安全性降低
      resolution: 0.05        # 地圖解析度(米/像素)，調大會提高精度但消耗更多記憶體，調小會節省記憶體但精度降低
      track_unknown_space: true # 是否追蹤未知空間，true會標記未知區域，false會忽略未知區域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # 使用的插件列表
      obstacle_layer:         # 障礙物層配置
        plugin: "nav2_costmap_2d::ObstacleLayer" # 障礙物層插件
        enabled: True         # 是否啟用
        observation_sources: scan # 觀測來源，使用雷射掃描數據
        scan:                  # 雷射掃描配置
          topic: /scan        # 雷射掃描話題名稱
          max_obstacle_height: 2.0 # 最大障礙物高度，調大會檢測更高障礙物，調小會忽略高障礙物
          clearing: True      # 是否清除障礙物，true會動態更新障礙物，false會靜態處理
          marking: True       # 是否標記障礙物，true會標記新障礙物，false會忽略新障礙物
          data_type: "LaserScan" # 數據類型，雷射掃描數據
          raytrace_max_range: 5.0  # 射線追蹤最大範圍(米)，調大會增加檢測範圍但計算量增加，調小會節省計算量但範圍有限
          raytrace_min_range: 0.0  # 射線追蹤最小範圍(米)，調大會忽略近距離障礙物，調小會檢測近距離障礙物
          obstacle_max_range: 5.0  # 障礙物最大檢測範圍(米)，調大會增加檢測範圍，調小會減少檢測範圍
          obstacle_min_range: 0.0  # 障礙物最小檢測範圍(米)，調大會忽略近距離障礙物，調小會檢測近距離障礙物
      static_layer:           # 靜態層配置
        plugin: "nav2_costmap_2d::StaticLayer" # 靜態層插件
        map_subscribe_transient_local: True # 是否使用瞬態本地訂閱，true會提高效率，false會使用標準訂閱
      inflation_layer:        # 膨脹層配置
        plugin: "nav2_costmap_2d::InflationLayer" # 膨脹層插件
        cost_scaling_factor: 2.0 # 成本縮放因子，調大會增加安全邊距但降低通過性，調小會提高通過性但安全性降低
        inflation_radius: 0.5 # 膨脹半徑(米)，調大會增加安全邊距，調小會減少安全邊距
      always_send_full_costmap: True # 是否總是發送完整成本地圖，true會發送完整地圖，false會只發送變化部分

local_costmap:                # 局部成本地圖配置
  local_costmap:
    ros__parameters:
      use_sim_time: true      # 使用模擬時間
      transform_tolerance: 0.5 # 座標轉換容差
      update_frequency: 5.0   # 更新頻率(Hz)，調大會提高局部地圖更新速度，調小會節省資源
      publish_frequency: 5.0  # 發布頻率(Hz)，調大會提高局部地圖發布速度，調小會減少網路負載
      global_frame: map # 全域座標系
      odom_frame: odom   # 里程計座標系
      robot_base_frame: base_link # 機器人底座座標系
      rolling_window: true    # 是否使用滾動視窗，true會跟隨機器人移動，false會固定位置
      width: 5               # 局部地圖寬度(米)，調大會增加局部規劃範圍但消耗更多記憶體，調小會節省記憶體但範圍有限
      height: 5               # 局部地圖高度(米)，調大會增加局部規劃範圍但消耗更多記憶體，調小會節省記憶體但範圍有限
      resolution: 0.05        # 地圖解析度(米/像素)
      robot_radius: 0.1      # 機器人半徑(米)
      plugins: ["obstacle_layer", "inflation_layer"] # 使用的插件列表
      inflation_layer:        # 膨脹層配置
        plugin: "nav2_costmap_2d::InflationLayer" # 膨脹層插件
        cost_scaling_factor: 2.0 # 成本縮放因子，調大會增加安全邊距，調小會減少安全邊距
        inflation_radius: 0.50 # 膨脹半徑(米)，調大會增加安全邊距，調小會減少安全邊距
      obstacle_layer:         # 障礙物層配置
        plugin: "nav2_costmap_2d::ObstacleLayer" # 障礙物層插件
        enabled: True         # 是否啟用
        observation_sources: scan # 觀測來源，使用雷射掃描數據
        scan:                  # 雷射掃描配置
          topic: /scan        # 雷射掃描話題名稱
          max_obstacle_height: 2.0 # 最大障礙物高度，調大會檢測更高障礙物，調小會忽略高障礙物
          clearing: True      # 是否清除障礙物，true會動態更新障礙物，false會靜態處理
          marking: True       # 是否標記障礙物，true會標記新障礙物，false會忽略新障礙物
          data_type: "LaserScan" # 數據類型，雷射掃描數據
          raytrace_max_range: 5.0  # 射線追蹤最大範圍(米)，調大會增加檢測範圍但計算量增加，調小會節省計算量但範圍有限
          raytrace_min_range: 0.0  # 射線追蹤最小範圍(米)，調大會忽略近距離障礙物，調小會檢測近距離障礙物
          obstacle_max_range: 5.0  # 障礙物最大檢測範圍(米)，調大會增加檢測範圍，調小會減少檢測範圍
          obstacle_min_range: 0.0  # 障礙物最小檢測範圍(米)，調大會忽略近距離障礙物，調小會檢測近距離障礙物

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

map_server:
  ros__parameters:
    use_sim_time: True
    
    # 地圖檔案（通常由 launch 傳入，不在這裡寫）
    # yaml_filename: "/path/to/map.yaml"  # 不建議寫這裡
    frame_id: map
    topic_name: "map"  # 發布地圖的 topic 名稱
    
    # QoS 設定
    qos_overrides:
      "/map":
        depth: 1
        durability: transient_local  # 晚到的訂閱者也能收到地圖
        reliability: reliable

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]        
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D" # In Iron and older versions, "/" was used instead of "::"
      tolerance: 0.125                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 500        # 預設 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    cmd_vel_in_topic: "/cmd_vel_nav"
    cmd_vel_out_topic: "/cmd_vel_smoothed"
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 2.0, 2.0]
    min_velocity: [-2.0, -2.0, -2.0]
    max_accel: [2.0, 2.0, 3.2]
    max_decel: [-2.0, -2.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "lidar"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true

slam_toolbox:
  ros__parameters:
    enabled: false
    use_sim_time: true
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_link"
    scan_topic: "/scan"
    mode: "mapping"
    resolution: 0.05
    map_update_interval: 1.0
    publish_map: true
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    enable_slam2d: true
    # 3D 特定參數
    # voxel_size: 0.1
    # octomap_resolution: 0.1
    # max_range: 10.0
    # min_range: 0.1
    # # 3D 建圖參數
    # publish_octomap: true
    # octomap_frame: "map"
    map_start_pose: [0.0, 0.0, 0.0]
    # z_offset: -0.25

